name: Bug report
description: Report a reproducible compiler or preview defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@haneoka/altair-plugin-vega-preview 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Boundary
      options:
        - Compiler contribution
        - Preview startup
        - Preview request or event
        - Cancellation or disposal
        - Packaging
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
